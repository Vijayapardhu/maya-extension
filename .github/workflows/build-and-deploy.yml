name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip extension
        run: |
          zip -r maya-autofill-extension.zip \
            manifest.json \
            background.js \
            content.js \
            firebase-config.js \
            hook-injected.js \
            hook.js \
            popup.html \
            popup.js \
            questions-template.json \
            README.md \
            setup.txt \
            icons/

      - name: Prepare publish folder
        run: |
          mkdir publish
          cp -r website/. publish/
          cp maya-autofill-extension.zip publish/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
